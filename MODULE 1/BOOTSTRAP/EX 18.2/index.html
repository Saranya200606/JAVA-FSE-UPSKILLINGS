<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Accordion</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Accordion Example</h2>

    <div class="accordion" id="demoAccordion">

        <!-- Item 1 -->
        <div class="accordion-item">

            <h2 class="accordion-header">
                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#item1">
                    Section 1
                </button>
            </h2>

            <div id="item1" class="accordion-collapse collapse show" data-bs-parent="#demoAccordion">
                <div class="accordion-body">
                    This is content for section 1.
                </div>
            </div>

        </div>

        <!-- Item 2 -->
        <div class="accordion-item">

            <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#item2">
                    Section 2
                </button>
            </h2>

            <div id="item2" class="accordion-collapse collapse" data-bs-parent="#demoAccordion">
                <div class="accordion-body">
                    This is content for section 2.
                </div>
            </div>

        </div>

        <!-- Item 3 -->
        <div class="accordion-item">

            <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#item3">
                    Section 3
                </button>
            </h2>

            <div id="item3" class="accordion-collapse collapse" data-bs-parent="#demoAccordion">
                <div class="accordion-body">
                    This is content for section 3.
                </div>
            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
