<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Column Order</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

    <div class="row">

        <!-- Second on mobile, first on md+ -->
        <div class="col-md-6 order-md-2">
            <div class="p-3 bg-success text-white text-center mb-3">
                Column A
            </div>
        </div>

        <!-- First on mobile, second on md+ -->
        <div class="col-md-6 order-md-1">
            <div class="p-3 bg-danger text-white text-center mb-3">
                Column B
            </div>
        </div>

    </div>

</div>

</body>
</html>
