<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Group</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Button Group</h2>

    <!-- Button Group -->
    <div class="btn-group mb-4" role="group">

        <button class="btn btn-primary">Left</button>
        <button class="btn btn-primary">Middle</button>
        <button class="btn btn-primary">Right</button>

    </div>

    <h2 class="mb-3">Toggle Buttons</h2>

    <!-- Toggle Buttons (Checkboxes) -->
    <div class="btn-group" role="group">

        <input type="checkbox" class="btn-check" id="check1">
        <label class="btn btn-outline-primary" for="check1">Option 1</label>

        <input type="checkbox" class="btn-check" id="check2">
        <label class="btn btn-outline-primary" for="check2">Option 2</label>

        <input type="checkbox" class="btn-check" id="check3">
        <label class="btn btn-outline-primary" for="check3">Option 3</label>

    </div>

</div>

</body>
</html>
