<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Column Layout</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3">
            <div class="p-3 bg-dark text-white">
                <h5>Sidebar</h5>
                <p>Navigation links or menu items go here.</p>
            </div>
        </div>

        <!-- Content Area -->
        <div class="col-md-9">
            <div class="p-3 bg-light">
                <h3>Main Content</h3>
                <p>
                    This is the main content area. It takes more space than the sidebar.
                    On mobile, both sidebar and content will stack vertically.
                </p>
            </div>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
