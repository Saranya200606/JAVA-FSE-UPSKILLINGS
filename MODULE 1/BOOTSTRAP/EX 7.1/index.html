<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography Utilities</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

    <h1 class="display-1">Display 1 Heading</h1>

    <p class="lead">
        This is a lead paragraph used to highlight important content.
    </p>

    <p class="text-muted">
        This is muted text used for secondary information.
    </p>

    <p class="fw-bold">
        This is bold text using fw-bold class.
    </p>

</div>

</body>
</html>
