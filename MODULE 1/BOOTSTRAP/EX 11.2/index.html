<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Object Layout</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

    <div class="d-flex">

        <!-- Left Image -->
        <img src="https://via.placeholder.com/100" class="me-3" alt="Image">

        <!-- Content -->
        <div>
            <h5>Media Heading</h5>
            <p>
                This is a sample media object layout using Bootstrap flex utilities.
                The image is aligned to the left and content is on the right.
            </p>
        </div>

    </div>

</div>

</body>
</html>
