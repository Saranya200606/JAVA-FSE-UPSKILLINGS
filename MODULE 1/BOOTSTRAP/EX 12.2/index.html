<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Section</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-5">Pricing Plans</h2>

    <div class="row">

        <!-- Basic Plan -->
        <div class="col-md-4 mb-4">
            <div class="card p-4 text-center">
                <h4 class="mb-3">Basic</h4>
                <h2 class="text-primary mb-3">₹199</h2>
                <p class="mb-4">Basic features for personal use</p>
                <button class="btn btn-outline-primary">Choose Plan</button>
            </div>
        </div>

        <!-- Standard Plan -->
        <div class="col-md-4 mb-4">
            <div class="card p-4 text-center">
                <h4 class="mb-3">Standard</h4>
                <h2 class="text-success mb-3">₹499</h2>
                <p class="mb-4">Best for small businesses</p>
                <button class="btn btn-success">Choose Plan</button>
            </div>
        </div>

        <!-- Premium Plan -->
        <div class="col-md-4 mb-4">
            <div class="card p-4 text-center">
                <h4 class="mb-3">Premium</h4>
                <h2 class="text-danger mb-3">₹999</h2>
                <p class="mb-4">All features included</p>
                <button class="btn btn-danger">Choose Plan</button>
            </div>
        </div>

    </div>

</div>

</body>
</html>
